<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Wooden Pinboard Frame -->
  <rect x="8" y="10" width="48" height="42" fill="#78350F" rx="2"/>
  <!-- Textured Cork Surface -->
  <rect x="11" y="13" width="42" height="36" fill="#D97706" rx="1"/>
  <!-- Yellow Post-It Note -->
  <rect x="15" y="16" width="10" height="10" fill="#FDE047" rx="1"/>
  <circle cx="20" cy="17" r="1" fill="#EF4444" shape-rendering="auto"/>
  <!-- Blue Note -->
  <rect x="28" y="17" width="11" height="8" fill="#7DD3FC" rx="1"/>
  <circle cx="33" cy="18" r="1" fill="#2563EB" shape-rendering="auto"/>
  <!-- Pink Sticky Note -->
  <rect x="16" y="30" width="9" height="11" fill="#F472B6" rx="1"/>
  <circle cx="20" cy="31" r="1" fill="#BE185D" shape-rendering="auto"/>
  <!-- Green Note -->
  <rect x="29" y="29" width="10" height="10" fill="#86EFAC" rx="1"/>
  <circle cx="34" cy="30" r="1" fill="#15803D" shape-rendering="auto"/>
  <!-- Pinned Polaroids / Photos -->
  <rect x="42" y="20" width="8" height="10" fill="#F8FAFC"/>
  <rect x="43" y="21" width="6" height="6" fill="#38BDF8"/>
  <circle cx="46" cy="20.5" r="1" fill="#EAB308" shape-rendering="auto"/>
</svg>
