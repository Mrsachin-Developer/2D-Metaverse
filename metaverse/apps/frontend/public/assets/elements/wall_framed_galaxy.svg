<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Sleek Dark Wood Picture Frame -->
  <rect x="8" y="10" width="48" height="44" fill="#1E293B" rx="2"/>
  <rect x="11" y="13" width="42" height="38" fill="#0F172A" rx="1"/>
  <!-- Space Galaxy Background -->
  <rect x="12" y="14" width="40" height="32" fill="#090D16"/>
  <!-- Starfield Dots -->
  <circle cx="16" cy="18" r="0.8" fill="#FFFFFF" shape-rendering="auto"/>
  <circle cx="28" cy="16" r="0.8" fill="#67E8F9" shape-rendering="auto"/>
  <circle cx="44" cy="20" r="0.8" fill="#FFFFFF" shape-rendering="auto"/>
  <circle cx="48" cy="32" r="0.8" fill="#FDE047" shape-rendering="auto"/>
  <circle cx="18" cy="36" r="0.8" fill="#FFFFFF" shape-rendering="auto"/>
  <!-- Blue Planet Earth -->
  <circle cx="32" cy="28" r="11" fill="#2563EB" shape-rendering="auto"/>
  <ellipse cx="28" cy="26" rx="5" ry="3" fill="#22C55E" shape-rendering="auto"/>
  <ellipse cx="36" cy="31" rx="4" ry="2.5" fill="#22C55E" shape-rendering="auto"/>
  <circle cx="33" cy="24" r="2" fill="#16A34A" shape-rendering="auto"/>
  <!-- Atmosphere Glow -->
  <circle cx="32" cy="28" r="12" fill="none" stroke="#67E8F9" stroke-width="1" opacity="0.6" shape-rendering="auto"/>
  <!-- Bottom Caption Plaque -->
  <rect x="24" y="48" width="16" height="2" fill="#64748B" rx="1"/>
</svg>
