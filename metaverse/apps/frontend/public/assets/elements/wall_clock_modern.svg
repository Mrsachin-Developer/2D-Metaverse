<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Red Outer Rim (as seen in Gather.town reference!) -->
  <circle cx="32" cy="32" r="22" fill="#DC2626" shape-rendering="auto"/>
  <circle cx="32" cy="32" r="20" fill="#EF4444" shape-rendering="auto"/>
  <!-- White Clock Face -->
  <circle cx="32" cy="32" r="17" fill="#FFFFFF" shape-rendering="auto"/>
  <!-- 12, 3, 6, 9 Hour Markers -->
  <rect x="31" y="17" width="2" height="4" fill="#1E293B"/>
  <rect x="31" y="43" width="2" height="4" fill="#1E293B"/>
  <rect x="17" y="31" width="4" height="2" fill="#1E293B"/>
  <rect x="43" y="31" width="4" height="2" fill="#1E293B"/>
  <!-- Clock Hands -->
  <line x1="32" y1="32" x2="32" y2="22" stroke="#1E293B" stroke-width="2" stroke-linecap="round" shape-rendering="auto"/>
  <line x1="32" y1="32" x2="41" y2="32" stroke="#1E293B" stroke-width="2" stroke-linecap="round" shape-rendering="auto"/>
  <!-- Red Seconds Hand -->
  <line x1="32" y1="32" x2="25" y2="39" stroke="#EF4444" stroke-width="1" stroke-linecap="round" shape-rendering="auto"/>
  <circle cx="32" cy="32" r="2" fill="#DC2626" shape-rendering="auto"/>
</svg>
