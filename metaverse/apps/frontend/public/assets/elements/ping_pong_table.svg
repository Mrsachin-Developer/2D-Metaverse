<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64" shape-rendering="crispEdges">
  <!-- Floor Shadow -->
  <rect x="12" y="52" width="104" height="8" fill="rgba(0,0,0,0.3)" rx="3"/>
  <!-- Metal Legs & Frame -->
  <rect x="16" y="36" width="5" height="19" fill="#1E293B"/>
  <rect x="107" y="36" width="5" height="19" fill="#1E293B"/>
  <rect x="62" y="36" width="4" height="19" fill="#334155"/>
  <rect x="18" y="48" width="92" height="3" fill="#475569"/>
  <!-- Green Table Tennis Surface -->
  <rect x="10" y="14" width="108" height="26" fill="#15803D" rx="2"/>
  <rect x="12" y="16" width="104" height="22" fill="#16A34A" rx="1"/>
  <!-- White Perimeter Boundary Lines -->
  <rect x="13" y="17" width="102" height="20" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Center White Dividing Line -->
  <line x1="14" y1="27" x2="114" y2="27" stroke="#FFFFFF" stroke-width="1"/>
  <!-- Center Mesh Net -->
  <rect x="62" y="10" width="4" height="32" fill="#E2E8F0" rx="1"/>
  <line x1="62" y1="12" x2="66" y2="12" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Pink Ping Pong Paddles (as in Gather.town reference!) -->
  <circle cx="32" cy="23" r="4.5" fill="#F43F5E" shape-rendering="auto"/>
  <rect x="34" y="24" width="4" height="2" fill="#78350F" transform="rotate(25 34 24)"/>
  <circle cx="94" cy="29" r="4.5" fill="#F43F5E" shape-rendering="auto"/>
  <rect x="96" y="30" width="4" height="2" fill="#78350F" transform="rotate(25 96 30)"/>
  <!-- White Ping Pong Ball -->
  <circle cx="54" cy="22" r="2" fill="#FFFFFF" shape-rendering="auto"/>
</svg>
