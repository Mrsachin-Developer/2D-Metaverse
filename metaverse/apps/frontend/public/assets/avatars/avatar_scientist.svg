<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="32" cy="58" rx="16" ry="5" fill="rgba(0,0,0,0.35)" shape-rendering="auto"/>
  <!-- White Lab Coat Body -->
  <rect x="20" y="32" width="24" height="19" fill="#F8FAFC" rx="2"/>
  <!-- Inner Teal Shirt -->
  <polygon points="28,32 36,32 32,40" fill="#0D9488"/>
  <!-- Lab Coat Buttons & Pocket -->
  <rect x="31" y="42" width="2" height="2" fill="#94A3B8"/>
  <rect x="31" y="46" width="2" height="2" fill="#94A3B8"/>
  <rect x="23" y="39" width="4" height="5" fill="#E2E8F0" rx="1"/>
  <!-- ID Badge / Lanyard -->
  <line x1="31" y1="33" x2="25" y2="40" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="24" y="40" width="3" height="3" fill="#38BDF8"/>
  <!-- Dark Slacks -->
  <rect x="24" y="51" width="6" height="7" fill="#334155"/>
  <rect x="34" y="51" width="6" height="7" fill="#334155"/>
  <!-- Formal Shoes -->
  <rect x="23" y="56" width="8" height="4" fill="#0F172A" rx="1"/>
  <rect x="33" y="56" width="8" height="4" fill="#0F172A" rx="1"/>
  <!-- Hands -->
  <rect x="16" y="38" width="4" height="6" fill="#FBBF24" rx="1"/>
  <rect x="44" y="38" width="4" height="6" fill="#FBBF24" rx="1"/>
  <!-- Head -->
  <rect x="23" y="16" width="18" height="17" fill="#FBBF24" rx="3"/>
  <!-- Round Scientist Glasses -->
  <rect x="24" y="22" width="6" height="6" fill="none" stroke="#0D9488" stroke-width="1.5" rx="3"/>
  <rect x="34" y="22" width="6" height="6" fill="none" stroke="#0D9488" stroke-width="1.5" rx="3"/>
  <line x1="30" y1="25" x2="34" y2="25" stroke="#0D9488" stroke-width="1.5"/>
  <rect x="26" y="24" width="2" height="2" fill="#1E293B"/>
  <rect x="36" y="24" width="2" height="2" fill="#1E293B"/>
  <!-- Curly Hair Bun -->
  <rect x="21" y="11" width="22" height="7" fill="#78350F" rx="2"/>
  <circle cx="32" cy="9" r="6" fill="#78350F" shape-rendering="auto"/>
</svg>
