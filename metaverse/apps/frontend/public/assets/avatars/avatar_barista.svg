<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="32" cy="58" rx="16" ry="5" fill="rgba(0,0,0,0.35)" shape-rendering="auto"/>
  <!-- Maroon Flannel Shirt -->
  <rect x="21" y="32" width="22" height="18" fill="#991B1B" rx="2"/>
  <!-- Green Barista Apron -->
  <rect x="25" y="34" width="14" height="17" fill="#15803D" rx="1"/>
  <!-- Apron Straps -->
  <line x1="26" y1="34" x2="30" y2="31" stroke="#166534" stroke-width="2"/>
  <line x1="38" y1="34" x2="34" y2="31" stroke="#166534" stroke-width="2"/>
  <!-- Apron Pocket -->
  <rect x="28" y="42" width="8" height="5" fill="#166534" rx="1"/>
  <!-- Brown Pen in Pocket -->
  <rect x="30" y="40" width="1.5" height="4" fill="#D97706"/>
  <!-- Cuffed Khakis -->
  <rect x="24" y="50" width="6" height="8" fill="#D97706"/>
  <rect x="34" y="50" width="6" height="8" fill="#D97706"/>
  <!-- Boots -->
  <rect x="23" y="56" width="8" height="4" fill="#78350F" rx="1"/>
  <rect x="33" y="56" width="8" height="4" fill="#78350F" rx="1"/>
  <!-- Hands -->
  <rect x="17" y="38" width="4" height="6" fill="#FDBA74" rx="1"/>
  <rect x="43" y="38" width="4" height="6" fill="#FDBA74" rx="1"/>
  <!-- Head -->
  <rect x="23" y="17" width="18" height="17" fill="#FDBA74" rx="3"/>
  <!-- Eyes -->
  <rect x="27" y="24" width="3" height="3" fill="#1C1917"/>
  <rect x="35" y="24" width="3" height="3" fill="#1C1917"/>
  <!-- Little Stubble -->
  <rect x="28" y="30" width="8" height="2" fill="#B45309" opacity="0.6"/>
  <!-- Hipster Knit Beanie Hat -->
  <rect x="21" y="10" width="22" height="11" fill="#4B5563" rx="4"/>
  <rect x="20" y="18" width="24" height="3" fill="#374151" rx="1"/>
