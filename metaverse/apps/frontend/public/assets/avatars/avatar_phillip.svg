  <rect x="29" y="29" width="6" height="2" fill="#B45309" rx="1"/>
  <!-- Green Newsboy Cap -->
  <path d="M18 18 C18 10, 46 10, 46 18 Z" fill="#2E5A36" shape-rendering="auto"/>
