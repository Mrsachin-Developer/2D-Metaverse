<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="32" cy="58" rx="16" ry="5" fill="rgba(0,0,0,0.35)" shape-rendering="auto"/>
  <!-- Indigo Haori Robe -->
  <rect x="20" y="32" width="24" height="19" fill="#312E81" rx="2"/>
  <!-- White Kimono V-Collar -->
  <polygon points="26,32 32,41 29,32" fill="#F8FAFC"/>
  <polygon points="38,32 32,41 35,32" fill="#E2E8F0"/>
  <!-- Gold Sash (Obi) -->
  <rect x="23" y="42" width="18" height="4" fill="#D97706"/>
  <!-- Wide Hakama Pants -->
  <rect x="22" y="50" width="9" height="8" fill="#1E1B4B"/>
  <rect x="33" y="50" width="9" height="8" fill="#1E1B4B"/>
  <!-- Tabi & Geta Sandals -->
  <rect x="23" y="57" width="8" height="3" fill="#F8FAFC" rx="1"/>
  <rect x="33" y="57" width="8" height="3" fill="#F8FAFC" rx="1"/>
  <rect x="23" y="59" width="8" height="1.5" fill="#B45309"/>
  <rect x="33" y="59" width="8" height="1.5" fill="#B45309"/>
  <!-- Hands -->
  <rect x="16" y="37" width="4" height="6" fill="#FED7AA" rx="1"/>
  <rect x="44" y="37" width="4" height="6" fill="#FED7AA" rx="1"/>
  <!-- Head -->
  <rect x="23" y="16" width="18" height="17" fill="#FED7AA" rx="3"/>
  <!-- Sharp Eyes -->
  <rect x="26" y="24" width="4" height="2" fill="#0F172A"/>
  <rect x="35" y="24" width="4" height="2" fill="#0F172A"/>
  <!-- Black Hair with Topknot -->
  <rect x="21" y="12" width="22" height="7" fill="#0F172A" rx="2"/>
  <rect x="21" y="16" width="3" height="8" fill="#0F172A"/>
  <rect x="40" y="16" width="3" height="8" fill="#0F172A"/>
  <!-- Topknot Bun & White Ribbon -->
  <circle cx="32" cy="7" r="4.5" fill="#0F172A" shape-rendering="auto"/>
  <rect x="30" y="9" width="4" height="2" fill="#F8FAFC"/>
</svg>
