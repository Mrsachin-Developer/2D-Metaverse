<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="32" cy="58" rx="16" ry="5" fill="rgba(0,0,0,0.35)" shape-rendering="auto"/>
  <!-- Bushy White-Tipped Tail -->
  <ellipse cx="48" cy="42" rx="7" ry="12" fill="#EA580C" transform="rotate(35 48 42)" shape-rendering="auto"/>
  <ellipse cx="52" cy="35" rx="5" ry="7" fill="#F8FAFC" transform="rotate(35 52 35)" shape-rendering="auto"/>
  <!-- Fox Body -->
  <rect x="22" y="34" width="20" height="17" fill="#EA580C" rx="3"/>
  <!-- White Chest Fur -->
  <polygon points="26,34 38,34 32,47" fill="#F8FAFC"/>
  <!-- Fox Paws -->
  <rect x="24" y="50" width="6" height="8" fill="#1C1917" rx="1"/>
  <rect x="34" y="50" width="6" height="8" fill="#1C1917" rx="1"/>
  <rect x="23" y="56" width="8" height="3" fill="#1C1917" rx="1"/>
  <rect x="33" y="56" width="8" height="3" fill="#1C1917" rx="1"/>
  <!-- Fox Head -->
  <rect x="21" y="16" width="22" height="18" fill="#EA580C" rx="4"/>
  <!-- White Cheeks & Muzzle -->
  <polygon points="21,25 28,34 21,34" fill="#F8FAFC"/>
  <polygon points="43,25 36,34 43,34" fill="#F8FAFC"/>
  <rect x="27" y="27" width="10" height="7" fill="#F8FAFC" rx="2"/>
  <!-- Little Black Nose -->
  <rect x="30.5" y="27" width="3" height="2.5" fill="#1C1917" rx="1"/>
  <!-- Emerald Eyes -->
  <circle cx="27" cy="23" r="2.5" fill="#059669" shape-rendering="auto"/>
  <circle cx="37" cy="23" r="2.5" fill="#059669" shape-rendering="auto"/>
  <circle cx="28" cy="22" r="1" fill="#FFFFFF" shape-rendering="auto"/>
  <circle cx="38" cy="22" r="1" fill="#FFFFFF" shape-rendering="auto"/>
  <!-- Fox Pointy Ears -->
  <polygon points="21,17 26,7 30,17" fill="#EA580C"/>
  <polygon points="43,17 38,7 34,17" fill="#EA580C"/>
  <!-- Inner Pink Ears -->
  <polygon points="23,16 26,10 28,16" fill="#FDA4AF"/>
  <polygon points="41,16 38,10 36,16" fill="#FDA4AF"/>
</svg>
